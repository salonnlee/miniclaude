<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 690">
  <defs>
    <marker id="nnap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#066fd1"/></marker>
  </defs>

  <text x="440" y="30" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">四站一条问题链 · 四包行李 · 一张去向单</text>
  <text x="100" y="52" font-size="11" fill="#667382">带走的东西（知识点 / 结论 / 工具）</text>
  <text x="725" y="52" font-size="11" fill="#667382" text-anchor="middle">后面在哪用</text>

  <rect x="20" y="62" width="80" height="108" rx="8" fill="rgba(37,99,235,.12)" stroke="#066fd1"/>
  <text x="60" y="110" font-size="13" font-weight="600" fill="#066fd1" text-anchor="middle">NN1</text>
  <text x="60" y="130" font-size="9.5" fill="#667382" text-anchor="middle">会学习的函数</text>
  <rect x="110" y="62" width="440" height="108" rx="8" fill="#f8f9fc" stroke="rgba(37,99,235,.35)"/>
  <text x="122" y="86" font-size="10.5" fill="#262626">网络 = 带旋钮的函数</text>
  <text x="122" y="108" font-size="10.5" fill="#262626">loss 量错 · 梯度指坡 · LR 定步长 → 循环下坡就能学</text>
  <text x="122" y="130" font-size="10.5" fill="#2fb344">工具：数值梯度 —— 任何梯度都拿它对表查账</text>
  <text x="122" y="152" font-size="10.5" fill="#2fb344">工具：train loop 骨架（forward → loss → 更新）</text>
  <rect x="560" y="62" width="300" height="108" rx="8" fill="#f8f9fc" stroke="rgba(194,65,12,.4)"/>
  <text x="710" y="105" font-size="10.5" fill="#f76707" text-anchor="middle">02 的训练循环 = 这套循环原样搬过去</text>
  <text x="710" y="127" font-size="10.5" fill="#f76707" text-anchor="middle">之后一切「训练」都是它的变体</text>

  <rect x="20" y="182" width="80" height="108" rx="8" fill="rgba(21,128,61,.12)" stroke="#2fb344"/>
  <text x="60" y="230" font-size="13" font-weight="600" fill="#2fb344" text-anchor="middle">NN2</text>
  <text x="60" y="250" font-size="9.5" fill="#667382" text-anchor="middle">神经元与 XOR</text>
  <rect x="110" y="182" width="440" height="108" rx="8" fill="#f8f9fc" stroke="rgba(21,128,61,.35)"/>
  <text x="122" y="206" font-size="10.5" fill="#262626">神经元 = 加权和 + 激活，全部零件就这两样</text>
  <text x="122" y="228" font-size="10.5" fill="#262626">单层切不开 XOR → 叠一层折叠空间，一条直边开</text>
  <text x="122" y="250" font-size="10.5" fill="#2fb344">结论：死区存在（loss 卡住先换种子）· 解不唯一</text>
  <text x="122" y="272" font-size="10.5" fill="#2fb344">结论：深度 = 把不可分折叠成可分</text>
  <rect x="560" y="182" width="300" height="108" rx="8" fill="#f8f9fc" stroke="rgba(194,65,12,.4)"/>
  <text x="710" y="225" font-size="10.5" fill="#f76707" text-anchor="middle">02 的嵌入层 = 一张可学的权重表</text>
  <text x="710" y="247" font-size="10.5" fill="#f76707" text-anchor="middle">训不动的第一反应：换种子、查死区</text>

  <rect x="20" y="302" width="80" height="108" rx="8" fill="rgba(220,38,38,.12)" stroke="#d63939"/>
  <text x="60" y="350" font-size="13" font-weight="600" fill="#d63939" text-anchor="middle">NN3</text>
  <text x="60" y="370" font-size="9.5" fill="#667382" text-anchor="middle">反向传播</text>
  <rect x="110" y="302" width="440" height="108" rx="8" fill="#f8f9fc" stroke="rgba(220,38,38,.35)"/>
  <text x="122" y="326" font-size="10.5" fill="#262626">链式法则两规矩：一路连乘 · 岔口相加</text>
  <text x="122" y="348" font-size="10.5" fill="#262626">本地导数用本节点自己的输入</text>
  <text x="122" y="370" font-size="10.5" fill="#2fb344">结论：旋钮再多也只跑 1 前 1 后（一次前向记账、一次反向查账）</text>
  <text x="122" y="392" font-size="10.5" fill="#2fb344">陷阱：ReLU 折角导数不存在，两边各选一边</text>
  <rect x="560" y="302" width="300" height="108" rx="8" fill="#f8f9fc" stroke="rgba(194,65,12,.4)"/>
  <text x="710" y="345" font-size="10.5" fill="#f76707" text-anchor="middle">loss.backward() 的真身</text>
  <text x="710" y="367" font-size="10.5" fill="#f76707" text-anchor="middle">手推 × 数值互证 = 终身 debug 神器</text>

  <rect x="20" y="422" width="80" height="108" rx="8" fill="rgba(194,65,12,.12)" stroke="#f76707"/>
  <text x="60" y="464" font-size="13" font-weight="600" fill="#f76707" text-anchor="middle">NN4</text>
  <text x="60" y="484" font-size="9.5" fill="#667382" text-anchor="middle">softmax+交叉熵</text>
  <rect x="110" y="422" width="440" height="108" rx="8" fill="#f8f9fc" stroke="rgba(194,65,12,.35)"/>
  <text x="122" y="446" font-size="10.5" fill="#262626">softmax：分数 → 概率，和恒为 1 · 只看相对差距</text>
  <text x="122" y="468" font-size="10.5" fill="#262626">交叉熵 −ln(押对那格)：对「自信地错」罚得陡</text>
  <text x="122" y="490" font-size="10.5" fill="#2fb344">结论：配对抵消，梯度裸成 p − y（预测减真值）</text>
  <text x="122" y="512" font-size="10.5" fill="#2fb344">陷阱：exp 溢出 → 先减 max（平移不变的合法运用）</text>
  <rect x="560" y="422" width="300" height="108" rx="8" fill="#f8f9fc" stroke="rgba(194,65,12,.4)"/>
  <text x="710" y="465" font-size="10.5" fill="#f76707" text-anchor="middle">02 的输出层 + 损失就是这两件</text>
  <text x="710" y="487" font-size="10.5" fill="#f76707" text-anchor="middle">生成 = 从 p 里抽下一字符</text>

  <line x1="60" y1="533" x2="60" y2="548" stroke="#667382" stroke-width="1.4" marker-end="url(#nnap)"/>
  <rect x="20" y="552" width="840" height="122" rx="10" fill="#f8f9fc" stroke="rgba(37,99,235,.5)"/>
  <text x="440" y="576" font-size="12" font-weight="600" fill="#066fd1" text-anchor="middle">四包行李拼回主线 02_neural_bigram.py —— 每一行都有出处</text>
  <text x="440" y="600" font-size="10.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">嵌入查表(NN2 加权和) → matmul 出 logits(NN1 函数) → softmax(NN4)</text>
  <text x="440" y="622" font-size="10.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">→ −ln(NN4) → probs−y(NN4) → backward(NN3 查账) → SGD 更新(NN1 下坡)</text>
  <text x="440" y="644" font-size="10.5" fill="#f76707" text-anchor="middle">P0.3 mini-GPT 同一套，只多注意力；P0.4 的 temperature 就是对 p 动手脚</text>
  <text x="440" y="664" font-size="10.5" fill="#f76707" text-anchor="middle">训不动三招：换种子(NN2) · 对表(NN3) · 看 p 押谁(NN4)</text>
</svg>
