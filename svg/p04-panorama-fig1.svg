<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470">
  <defs>
    <marker id="p4f1g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
  </defs>

  <text x="24" y="28" font-size="13" font-weight="600" fill="#262626">① 两个旋钮拧在哪:抽签一步之前,模型与训练一概不碰</text>

  <text x="38" y="76" font-size="11" font-family="ui-monospace,Menlo,monospace" fill="#262626">前文 t h e</text>
  <line x1="104" y1="72" x2="130" y2="72" stroke="#667382" stroke-width="1.4" marker-end="url(#p4f1g)"/>

  <rect x="132" y="50" width="96" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="180" y="68" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">forward</text>
  <text x="180" y="84" font-size="9" fill="#667382" text-anchor="middle">67 个裸分数</text>

  <line x1="228" y1="72" x2="254" y2="72" stroke="#667382" stroke-width="1.4" marker-end="url(#p4f1g)"/>

  <rect x="256" y="50" width="118" height="44" rx="8" fill="rgba(194,65,12,.08)" stroke="rgba(194,65,12,.55)"/>
  <text x="315" y="68" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">旋钮一 top-k</text>
  <text x="315" y="84" font-size="9" fill="#667382" text-anchor="middle">榜外打 −∞ 清场</text>

  <line x1="374" y1="72" x2="400" y2="72" stroke="#667382" stroke-width="1.4" marker-end="url(#p4f1g)"/>

  <rect x="402" y="50" width="118" height="44" rx="8" fill="rgba(6,111,209,.06)" stroke="rgba(6,111,209,.4)"/>
  <text x="461" y="68" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">旋钮二 ÷ T</text>
  <text x="461" y="84" font-size="9" fill="#667382" text-anchor="middle">分数差距缩放</text>

  <line x1="520" y1="72" x2="546" y2="72" stroke="#667382" stroke-width="1.4" marker-end="url(#p4f1g)"/>

  <rect x="548" y="50" width="96" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="596" y="68" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">softmax</text>
  <text x="596" y="84" font-size="9" fill="#667382" text-anchor="middle">分数→概率</text>

  <line x1="644" y1="72" x2="670" y2="72" stroke="#667382" stroke-width="1.4" marker-end="url(#p4f1g)"/>

  <rect x="672" y="50" width="96" height="44" rx="8" fill="rgba(47,179,68,.08)" stroke="rgba(47,179,68,.5)"/>
  <text x="720" y="68" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">抽签</text>
  <text x="720" y="84" font-size="9" fill="#667382" text-anchor="middle">按概率掷骰子</text>

  <text x="38" y="122" font-size="10" fill="#4b5158">抽中 → 拼进前文尾 → 窗口右移一格 → 再来(P0.3 的自回归循环原样不动);旋钮只改「念答案的方式」,模型参数与考卷 loss 一个数都不动</text>
  <text x="38" y="140" font-size="10" fill="#c2430c">对照:训练用的 softmax 永远 T=1 裸跑——考卷要考真实判断,不要表演风格</text>

  <line x1="24" y1="164" x2="856" y2="164" stroke="#e6e7e9" stroke-dasharray="4 4"/>

  <text x="24" y="192" font-size="12" font-weight="600" fill="#262626">② temperature 拧的是什么:分数的差距,不是排名</text>
  <text x="38" y="216" font-size="10.5" fill="#4b5158">拿 3 个字的小账看(logits = 2 / 1 / 0):÷T 再 softmax,头名永远是头名,变的是赢面——</text>

  <rect x="38" y="232" width="200" height="150" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="138" y="254" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">T = 0.5(拉大差距)</text>
  <text x="52" y="276" font-size="9.5" fill="#4b5158">字 A(分 2):86.7%</text>
  <rect x="152" y="268" width="78" height="10" rx="3" fill="#066fd1"/>
  <text x="52" y="300" font-size="9.5" fill="#4b5158">字 B(分 1):11.7%</text>
  <rect x="152" y="292" width="11" height="10" rx="3" fill="rgba(6,111,209,.45)"/>
  <text x="52" y="324" font-size="9.5" fill="#4b5158">字 C(分 0):1.6%</text>
  <rect x="152" y="316" width="4" height="10" rx="2" fill="rgba(6,111,209,.25)"/>
  <text x="138" y="362" font-size="9.5" fill="#667382" text-anchor="middle">嘴替变稳,长尾怪字出局</text>

  <rect x="268" y="232" width="200" height="150" rx="8" fill="rgba(47,179,68,.06)" stroke="rgba(47,179,68,.45)"/>
  <text x="368" y="254" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">T = 1.0(模型本色)</text>
  <text x="282" y="276" font-size="9.5" fill="#4b5158">字 A:66.5%</text>
  <rect x="352" y="268" width="60" height="10" rx="3" fill="#2fb344"/>
  <text x="282" y="300" font-size="9.5" fill="#4b5158">字 B:24.5%</text>
  <rect x="352" y="292" width="22" height="10" rx="3" fill="rgba(47,179,68,.45)"/>
  <text x="282" y="324" font-size="9.5" fill="#4b5158">字 C:9.0%</text>
  <rect x="352" y="316" width="8" height="10" rx="3" fill="rgba(47,179,68,.25)"/>
  <text x="368" y="362" font-size="9.5" fill="#667382" text-anchor="middle">softmax 原样,不调温</text>

  <rect x="498" y="232" width="200" height="150" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="598" y="254" font-size="10.5" font-weight="600" fill="#262626" text-anchor="middle">T = 2.0(压平差距)</text>
  <text x="512" y="276" font-size="9.5" fill="#4b5158">字 A:50.6%</text>
  <rect x="582" y="268" width="46" height="10" rx="3" fill="#066fd1"/>
  <text x="512" y="300" font-size="9.5" fill="#4b5158">字 B:30.7%</text>
  <rect x="582" y="292" width="28" height="10" rx="3" fill="rgba(6,111,209,.45)"/>
  <text x="512" y="324" font-size="9.5" fill="#4b5158">字 C:18.6%</text>
  <rect x="582" y="316" width="17" height="10" rx="3" fill="rgba(6,111,209,.25)"/>
  <text x="598" y="362" font-size="9.5" fill="#667382" text-anchor="middle">冷门翻身,嘴替发疯</text>

  <text x="730" y="262" font-size="9.5" fill="#667382">两个极限:</text>
  <text x="730" y="280" font-size="9.5" fill="#4b5158">T→0 概率塌成</text>
  <text x="730" y="296" font-size="9.5" fill="#4b5158">「头名独中」</text>
  <text x="730" y="312" font-size="9.5" fill="#4b5158">(= 贪心);</text>
  <text x="730" y="334" font-size="9.5" fill="#4b5158">T→∞ 塌回均匀,</text>
  <text x="730" y="350" font-size="9.5" fill="#4b5158">= 训练前的纯噪声</text>

  <text x="24" y="424" font-size="10.5" fill="#4b5158">为什么除的是分数不是概率:softmax 里概率走的是指数路 e^logits,除法在指数外面做,等价于把每个概率开 T 次方再归一——差距被幂次缩放,排名纹丝不动。</text>
  <text x="24" y="448" font-size="10.5" font-weight="600" fill="#2fb344">top-k 与 T 可叠加:先清场再调温差;T≤0 单独接住走 argmax——这就是极限贪心本尊</text>
</svg>
