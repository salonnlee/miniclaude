<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500">
  <defs>
    <marker id="b4ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
  </defs>

  <text x="105" y="30" font-size="13" font-weight="600" fill="#262626">① 最小网络 · 敏感度沿链乘回</text>
  <text x="105" y="48" font-size="10.5" fill="#667382">片中图 1 那帧：变量减到最少，机制才看得清</text>

  <rect x="105" y="64" width="330" height="52" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="85" font-size="12.5" font-weight="600" fill="#262626">⛓️ 三层小链，每层 1 神经元</text>
  <text x="121" y="104" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">C(w₁,b₁,w₂,b₂,w₃,b₃) —— 旋钮 6 个</text>
  <line x1="270" y1="118" x2="270" y2="136" stroke="#667382" stroke-width="1.5" marker-end="url(#b4ar)"/>

  <rect x="105" y="142" width="330" height="52" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="163" font-size="12.5" font-weight="600" fill="#262626">🎯 问：loss 对 w₁ 多敏感？</text>
  <text x="121" y="182" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">w₁ 在链头 · C 挂在链尾 a⁽ᴸ⁾ 上</text>
  <line x1="270" y1="196" x2="270" y2="214" stroke="#667382" stroke-width="1.5" marker-end="url(#b4ar)"/>

  <rect x="105" y="220" width="330" height="52" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="241" font-size="12.5" font-weight="600" fill="#262626">🔗 链式法则：沿链乘回去</text>
  <text x="121" y="260" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">∂C/∂w = 前层激活 × σ′ × 心愿</text>
  <line x1="270" y1="274" x2="270" y2="292" stroke="#667382" stroke-width="1.5" marker-end="url(#b4ar)"/>

  <rect x="105" y="298" width="330" height="52" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
