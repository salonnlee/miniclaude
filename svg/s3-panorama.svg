<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730">
  <defs>
    <marker id="s3par" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
    <marker id="s3parR" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d63939"/></marker>
    <marker id="s3parO" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f76707"/></marker>
  </defs>

  <text x="110" y="30" font-size="13" font-weight="600" fill="#262626">① 账单：量坡的两种付法</text>

  <rect x="50" y="52" width="200" height="120" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="150" y="78" font-size="12.5" font-weight="600" fill="#262626" text-anchor="middle">📏 数值梯度（老尺子）</text>
  <text x="150" y="102" font-size="11" fill="#667382" text-anchor="middle">每旋钮量两次 loss</text>
  <text x="150" y="124" font-size="11" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">9 旋钮 → 18 次前向</text>
  <text x="150" y="146" font-size="11" fill="#f76707" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">13,002 → 26,004 次/步</text>
  <text x="150" y="162" font-size="10" fill="#667382" text-anchor="middle">参数越多，跑死自己</text>

  <rect x="272" y="52" width="200" height="120" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="372" y="78" font-size="12.5" font-weight="600" fill="#2fb344" text-anchor="middle">⚡ 反向传播</text>
  <text x="372" y="102" font-size="11" fill="#667382" text-anchor="middle">前向算值并记账，反向查账</text>
  <text x="372" y="124" font-size="11" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">任意多旋钮 → 1 前 + 1 反</text>
  <text x="372" y="146" font-size="11" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">旋钮数×4000，前向数不变</text>
  <text x="372" y="162" font-size="10" fill="#667382" text-anchor="middle">所有参数共享同一条前向路</text>

  <text x="110" y="212" font-size="13" font-weight="600" fill="#262626">② 链式法则：两条规矩</text>

  <text x="60" y="238" font-size="11" fill="#667382">一条路上 · 本地导数连乘</text>
  <text x="60" y="262" font-size="11.5" fill="#262626" font-family="ui-monospace,Menlo,monospace">x=4 → [×3] a=12 → [²] 144 → [+2] 146</text>
  <text x="60" y="284" font-size="11.5" fill="#262626" font-family="ui-monospace,Menlo,monospace">3 × 2×12 × 1 = 72 ✓数值=72</text>
  <text x="60" y="306" font-size="10.5" fill="#f76707">平方层用自己的输入 12——展开拿 9 = 乘 3 层背两遍锅</text>

  <text x="60" y="338" font-size="11" fill="#667382">一个岔口 · 各路责任相加</text>
  <text x="60" y="362" font-size="11.5" fill="#262626" font-family="ui-monospace,Menlo,monospace">loss = (3x)² + (x+1)：72 + 1 = 73</text>
  <text x="60" y="384" font-size="10.5" fill="#667382">x 走几条路，就领几份锅再相加</text>

  <rect x="60" y="408" width="412" height="70" rx="10" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.5)"/>
  <text x="72" y="432" font-size="12" font-weight="600" fill="#262626">⚠ 本课唯一的不一致 · ReLU 折角</text>
  <text x="72" y="452" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">h1=0 正卡刀刃：手推给 0，数值只量右侧坡 0.125</text>
  <text x="72" y="468" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">折角处导数不存在——27 行对表其余全 ✓</text>

  <text x="500" y="30" font-size="13" font-weight="600" fill="#262626">③ 反向责任流（NN2 的 2-2-1 网络）</text>

  <text x="516" y="62" font-size="11.5" fill="#262626" font-family="ui-monospace,Menlo,monospace">h1' h2' ─[×W2]→ out ─[sigmoid]→ loss</text>
  <line x1="660" y1="70" x2="660" y2="90" stroke="#d63939" stroke-width="1.6" marker-end="url(#s3parR)"/>
  <text x="672" y="84" font-size="10" fill="#d63939">责任 δ 往回走</text>

  <rect x="500" y="96" width="360" height="58" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="516" y="118" font-size="12" font-weight="600" fill="#262626">读出层：三旋钮 = 各自乘的东西 × δ</text>
  <text x="516" y="140" font-size="11" fill="#667382" font-family="ui-monospace,Menlo,monospace">δ=2(out−y)·out(1−out) · dw20=h1'·δ · db2o=1·δ</text>

  <line x1="680" y1="158" x2="680" y2="176" stroke="#d63939" stroke-width="1.6" marker-end="url(#s3parR)"/>
  <text x="692" y="172" font-size="10" fill="#d63939">穿 ReLU（查账：h&gt;0?1:0）</text>

  <rect x="500" y="182" width="360" height="58" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="516" y="204" font-size="12" font-weight="600" fill="#262626">隐层：δ1 = w20·δ·(h1&gt;0?1:0)</text>
  <text x="516" y="226" font-size="11" fill="#667382" font-family="ui-monospace,Menlo,monospace">六旋钮 = 各自乘的东西（x1、x2、1）× δ1/δ2</text>

  <rect x="500" y="258" width="360" height="58" rx="10" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.5)"/>
  <text x="516" y="280" font-size="12" font-weight="600" fill="#262626">⚠ 死区精确版</text>
  <text x="516" y="302" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">两隐层全灭：dw20=dw21o=0，但 db2o=0.25≠0</text>
  <text x="516" y="312" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">偏置旁路活着——责任只是过不去 ReLU</text>

  <rect x="500" y="334" width="360" height="70" rx="10" fill="rgba(21,128,61,.06)" stroke="rgba(21,128,61,.5)"/>
  <text x="680" y="360" font-size="12.5" font-weight="600" fill="#2fb344" text-anchor="middle">反向梯度训练 XOR · 实测</text>
  <text x="680" y="382" font-size="11" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">首跑撞回死区（loss 卡 0.175）→ 换种子才活</text>
  <text x="680" y="398" font-size="11" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">seed=10：8000 步 loss 0.000025 · 四题全对</text>

  <text x="860" y="480" font-size="13" font-weight="600" fill="#262626" text-anchor="end">④ 网络全景：2-2-1 · 九旋钮 · 责任流</text>

  <circle cx="90" cy="530" r="17" fill="rgba(37,99,235,.12)" stroke="#066fd1"/>
  <text x="90" y="535" font-size="12" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">x1</text>
  <circle cx="90" cy="595" r="17" fill="rgba(37,99,235,.12)" stroke="#066fd1"/>
  <text x="90" y="600" font-size="12" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">x2</text>
  <text x="90" y="640" font-size="10" fill="#667382" text-anchor="middle">输入(0/1)</text>

  <line x1="107" y1="525" x2="180" y2="505" stroke="#066fd1" stroke-width="1.5" marker-end="url(#s3par)"/>
  <line x1="107" y1="588" x2="180" y2="522" stroke="#066fd1" stroke-width="1.5" marker-end="url(#s3par)"/>
  <line x1="107" y1="537" x2="180" y2="580" stroke="#066fd1" stroke-width="1.5" marker-end="url(#s3par)"/>
  <line x1="107" y1="610" x2="180" y2="602" stroke="#066fd1" stroke-width="1.5" marker-end="url(#s3par)"/>
  <text x="115" y="516" font-size="10" fill="#667382" font-family="ui-monospace,Menlo,monospace">w11</text>
  <text x="160" y="552" font-size="10" fill="#667382" font-family="ui-monospace,Menlo,monospace">w21</text>
  <text x="115" y="550" font-size="10" fill="#667382" font-family="ui-monospace,Menlo,monospace">w12</text>
  <text x="112" y="626" font-size="10" fill="#667382" font-family="ui-monospace,Menlo,monospace">w22</text>

  <rect x="183" y="490" width="175" height="52" rx="10" fill="rgba(21,128,61,.08)" stroke="rgba(21,128,61,.55)"/>
  <text x="270" y="511" font-size="10.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">h1 = w11·x1+w21·x2+b1</text>
  <text x="270" y="530" font-size="10.5" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">ReLU → h1'</text>

  <rect x="183" y="565" width="175" height="52" rx="10" fill="rgba(21,128,61,.08)" stroke="rgba(21,128,61,.55)"/>
  <text x="270" y="586" font-size="10.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">h2 = w12·x1+w22·x2+b2</text>
  <text x="270" y="605" font-size="10.5" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">ReLU → h2'</text>

  <line x1="358" y1="514" x2="445" y2="537" stroke="#066fd1" stroke-width="1.5" marker-end="url(#s3par)"/>
  <line x1="358" y1="588" x2="445" y2="555" stroke="#066fd1" stroke-width="1.5" marker-end="url(#s3par)"/>
  <text x="392" y="512" font-size="10" fill="#667382" font-family="ui-monospace,Menlo,monospace">W2[0]</text>
  <text x="392" y="590" font-size="10" fill="#667382" font-family="ui-monospace,Menlo,monospace">W2[1]</text>

  <rect x="448" y="515" width="195" height="72" rx="10" fill="rgba(194,65,12,.08)" stroke="rgba(194,65,12,.55)"/>
  <text x="545" y="537" font-size="10.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">out = W2[0]·h1'</text>
  <text x="545" y="554" font-size="10.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">+ W2[1]·h2' + b_out</text>
  <text x="545" y="574" font-size="10.5" fill="#f76707" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">sigmoid → (0,1)</text>

  <line x1="643" y1="551" x2="690" y2="551" stroke="#d63939" stroke-width="1.6" marker-end="url(#s3parR)"/>
  <text x="722" y="556" font-size="12" fill="#d63939" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">loss</text>
  <text x="722" y="572" font-size="9.5" fill="#667382" text-anchor="middle">(out−y)²</text>

  <path d="M710,585 C640,645 250,650 130,622" fill="none" stroke="#d63939" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#s3parR)"/>
  <text x="420" y="662" font-size="10.5" fill="#d63939" text-anchor="middle">反向：责任回传 = 上游责任 × 本地导数（权重 = 它乘的东西 · ReLU = h&gt;0?1:0 · 偏置 = 1）</text>

  <text x="455" y="496" font-size="10.5" fill="#066fd1" text-anchor="middle">→ 前向：算值并记账</text>

  <rect x="500" y="678" width="360" height="40" rx="10" fill="#f8f9fc" stroke="rgba(194,65,12,.55)"/>
  <text x="680" y="703" font-size="11.5" fill="#f76707" text-anchor="middle">→ NN4：softmax + 交叉熵，学完回主线 02</text>
</svg>
