<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500">
  <defs>
    <marker id="b1ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
  </defs>

  <text x="105" y="30" font-size="13" font-weight="600" fill="#262626">① 训练 · 数数建表（在语料上跑一遍）</text>

  <rect x="105" y="50" width="305" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="69" font-size="12.5" font-weight="600" fill="#262626">📄 语料</text>
  <text x="121" y="87" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">data/input.txt（莎士比亚）</text>
  <line x1="257" y1="98" x2="257" y2="114" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="105" y="118" width="305" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="137" font-size="12.5" font-weight="600" fill="#262626">🔗 相邻对（滑窗配对）</text>
  <text x="121" y="155" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">zip(text, text[1:])</text>
  <line x1="257" y1="166" x2="257" y2="182" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="105" y="186" width="305" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="205" font-size="12.5" font-weight="600" fill="#262626">📚 counts 账本</text>
  <text x="121" y="223" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">counts[prev][nxt] += 1</text>
  <line x1="257" y1="234" x2="257" y2="250" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="105" y="254" width="305" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="273" font-size="12.5" font-weight="600" fill="#262626">➗ 归一化</text>
  <text x="121" y="291" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">每行除以自己的总数</text>
  <line x1="257" y1="302" x2="257" y2="318" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="105" y="322" width="305" height="46" rx="10" fill="#f8f9fc" stroke="rgba(194,65,12,.55)"/>
  <text x="121" y="341" font-size="12.5" font-weight="600" fill="#262626">📊 probs:67 张概率表</text>
  <text x="121" y="359" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">probs[cur] = 下一个字符的分布</text>

  <text x="105" y="398" font-size="10.5" fill="#667382">真实语料实例（mono 概率行）：</text>
  <text x="105" y="414" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">probs[t]: h 33.5% · ␣ 24.8% · o 8.5%</text>

  <text x="500" y="30" font-size="13" font-weight="600" fill="#262626">② 生成 · 查表抽签（循环 ×600）</text>

  <rect x="500" y="50" width="330" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="516" y="69" font-size="12.5" font-weight="600" fill="#262626">🎯 cur · 当前字符</text>
  <text x="516" y="87" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">从 ⏎（换行符）开场</text>
  <line x1="665" y1="98" x2="665" y2="114" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="500" y="118" width="330" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="516" y="137" font-size="12.5" font-weight="600" fill="#262626">🔍 查表</text>
  <text x="516" y="155" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">probs[cur] → 候选概率行</text>
  <line x1="665" y1="166" x2="665" y2="182" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="500" y="186" width="330" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="516" y="205" font-size="12.5" font-weight="600" fill="#262626">🎲 加权抽签</text>
  <text x="516" y="223" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">random.choices(probs[cur])</text>
  <line x1="665" y1="234" x2="665" y2="250" stroke="#667382" stroke-width="1.5" marker-end="url(#b1ar)"/>

  <rect x="500" y="254" width="330" height="46" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="516" y="273" font-size="12.5" font-weight="600" fill="#262626">📝 追加 &amp; 更新</text>
  <text x="516" y="291" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">out.append(c); cur = c</text>

  <path d="M500,277 C466,277 466,73 496,73" fill="none" stroke="#667382" stroke-width="1.3" marker-end="url(#b1ar)" opacity=".75"/>
  <text x="458" y="175" font-size="11" fill="#667382" text-anchor="middle" transform="rotate(-90 458 175)">🔁 ×600 步</text>

  <rect x="500" y="310" width="330" height="76" rx="10" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.5)"/>
  <text x="516" y="332" font-size="12.5" font-weight="600" fill="#262626">⚠ 必修实验：贪心 argmax 自锁实录</text>
  <text x="516" y="352" font-size="10.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">⏎ 自环坑（18.6%） · ␣→t→h→e 循环圈</text>
  <text x="516" y="370" font-size="10.5" fill="#667382">= temperature=0 变复读机之种（P0.4 见）</text>

  <rect x="105" y="430" width="725" height="50" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="467" y="450" font-size="12" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">×600 步 → 满嘴莎翁味儿的胡话 · 模型 = 无状态的查表函数</text>
  <text x="467" y="468" font-size="10.5" fill="#667382" text-anchor="middle">这张手工数出来的表，P0.2 将换成梯度下降学出来的神经网络</text>
</svg>
