<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352">
  <defs>
    <marker id="tfexar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
  </defs>
  <text x="105" y="30" font-size="13" font-weight="600" fill="#262626">两步出分 · 最后一行怎么变成概率表</text>
  <text x="105" y="48" font-size="10.5" fill="#667382">先跟每个词条比一遍，再把分数抹成概率——「好 61%」的表就在这里出炉</text>

  <text x="115" y="76" font-size="11" fill="#667382" text-anchor="middle">进场 · 穿完 96 块的最后一行</text>
  <rect x="40" y="86" width="150" height="60" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="115" y="110" font-size="12" font-weight="600" fill="#262626" text-anchor="middle">🧾 最后一行</text>
  <text x="115" y="132" font-size="10.5" fill="#066fd1" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">第 5 行「真」· 装着全句</text>
  <line x1="192" y1="116" x2="224" y2="116" stroke="#667382" stroke-width="1.5" marker-end="url(#tfexar)"/>

  <text x="395" y="76" font-size="11" fill="#667382" text-anchor="middle">出口 · 两步出分</text>
  <rect x="230" y="86" width="330" height="62" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="246" y="108" font-size="12.5" font-weight="600" fill="#262626">⚖️ 第一步 打分 · 点积</text>
  <text x="246" y="126" font-size="10" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">12,288 对数对应相乘，再求和</text>
  <text x="246" y="141" font-size="10" fill="#667382">和每个词条比一遍——越对得上，分越高</text>
  <line x1="395" y1="148" x2="395" y2="160" stroke="#667382" stroke-width="1.5" marker-end="url(#tfexar)"/>
  <rect x="230" y="162" width="330" height="62" rx="10" fill="rgba(37,99,235,.06)" stroke="rgba(37,99,235,.4)"/>
  <text x="246" y="184" font-size="12.5" font-weight="600" fill="#262626">🌊 第二步 softmax</text>
  <text x="246" y="202" font-size="10" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">每个分数取 e 的幂 · 再除以总和</text>
  <text x="246" y="217" font-size="10" fill="#667382">拉大差距、全变正数——加和恰好 100%</text>
  <text x="395" y="246" font-size="10" fill="#667382" text-anchor="middle">出口表每词条一行，通常就是入口嵌入表转过来共用</text>
  <text x="395" y="262" font-size="10" fill="#667382" text-anchor="middle">（论文记作 W_U，解嵌入矩阵）——省一半存储</text>

  <text x="720" y="76" font-size="11" fill="#667382" text-anchor="middle">交卷 · 概率表</text>
  <text x="644" y="98" font-size="11" fill="#4b5158" text-anchor="end">好</text>
  <rect x="652" y="86" width="158" height="18" rx="4" fill="rgba(194,65,12,.7)"/>
  <text x="818" y="99" font-size="10" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">61%</text>
  <text x="644" y="126" font-size="11" fill="#4b5158" text-anchor="end">的</text>
  <rect x="652" y="114" width="31" height="18" rx="4" fill="rgba(37,99,235,.45)"/>
  <text x="691" y="127" font-size="10" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">12%</text>
  <text x="644" y="154" font-size="11" fill="#4b5158" text-anchor="end">不</text>
  <rect x="652" y="142" width="13" height="18" rx="4" fill="rgba(37,99,235,.45)"/>
  <text x="673" y="155" font-size="10" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">5%</text>
  <text x="644" y="182" font-size="11" fill="#4b5158" text-anchor="end">其余</text>
  <rect x="652" y="170" width="57" height="18" rx="4" fill="rgba(107,107,118,.3)"/>
  <text x="717" y="183" font-size="10" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">22%</text>

  <rect x="600" y="200" width="240" height="84" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="616" y="222" font-size="12" font-weight="600" fill="#262626">🎲 挑字二选一</text>
  <text x="616" y="242" font-size="10.5" fill="#667382">贪心——永远挑第一名，稳但呆板</text>
  <text x="616" y="260" font-size="10.5" fill="#667382">采样——按概率挑，文字更活</text>
  <text x="616" y="278" font-size="10.5" fill="#667382">温度：调低近贪心，调高更易胡说</text>

  <rect x="60" y="298" width="760" height="46" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="440" y="317" font-size="12" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">文字进 → 查表 → 96 块积木 → 概率表 → 挑一个接尾 → 新尾巴又进 → 循环</text>
  <text x="440" y="335" font-size="10.5" fill="#667382" text-anchor="middle">出口宽度被词表钉死——要给每个词条一个概率，格数 = 词条数，没有第二种选法</text>
</svg>
