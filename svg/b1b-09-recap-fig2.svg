  <text x="16" y="26" font-size="13" font-weight="700" fill="#262626">图二 · MLP 两步账：升维对暗号 → GELU 开关 → 降维翻译回</text>
  <text x="16" y="46" font-size="10.5" fill="#667382">进 MLP 时「篮球」只是万千成分里不突出的一份，出来时已是这根向量的主旋律</text>
  <text x="60" y="72" font-size="10" fill="#667382" text-anchor="middle">进</text>
