  <text x="600" y="302" font-size="10.5" fill="#667382" text-anchor="middle">12,288 维</text>
  <text x="648" y="96" font-size="10.5" fill="#4b5158">降维 = 把亮着的特征</text>
  <text x="648" y="114" font-size="10.5" fill="#4b5158">翻译回词空间：篮球探测器</text>
  <text x="648" y="134" font-size="10.5" fill="#f76707">亮 → 添一大坨「basketball</text>
  <text x="648" y="152" font-size="10.5" fill="#f76707">方向」的成分</text>
  <text x="648" y="178" font-size="10" fill="#667382">输出条橙色三格 =</text>
  <text x="648" y="194" font-size="10" fill="#667382">新添的成分（示意）</text>
  <rect x="16" y="322" width="848" height="38" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="440" y="338" font-size="11.5" fill="#2fb344" text-anchor="middle">MLP 不看邻居（那是注意力的活）：逐行独立、全序列共用同一套权重</text>
  <text x="440" y="354" font-size="10.5" fill="#667382" text-anchor="middle">每层 ≈1,160 亿参数 = 注意力的两倍——「MLP 才是大头」的机制版，也是本集「事实住 MLP」的地盘</text>
  <rect x="16" y="366" width="848" height="34" rx="10" fill="#e7f1fb" stroke="#9cc3ec"/>
  <text x="440" y="387" font-size="11" fill="#0553a3" text-anchor="middle">升维表 49,152×12,288 + 降维表 12,288×49,152，每层 57,982,058,496×2——全账对表见下</text>
