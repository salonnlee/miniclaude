  <text x="474" y="108" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">逐格开关</text>
  <text x="474" y="128" font-size="10" fill="#2fb344" text-anchor="middle">正分 → 放行</text>
  <rect x="414" y="136" width="20" height="14" rx="3" fill="#dfe3e9" stroke="#dfe3e9"/><rect x="438" y="136" width="20" height="14" rx="3" fill="#dfe3e9" stroke="#dfe3e9"/><rect x="462" y="136" width="20" height="14" rx="3" fill="#dfe3e9" stroke="#dfe3e9"/><rect x="486" y="136" width="20" height="14" rx="3" fill="#dfe3e9" stroke="#dfe3e9"/><rect x="510" y="136" width="20" height="14" rx="3" fill="#dfe3e9" stroke="#dfe3e9"/>
  <text x="474" y="186" font-size="10" fill="#667382" text-anchor="middle">负分 → 掐向零</text>
  <rect x="414" y="196" width="20" height="14" rx="3" fill="#fff" stroke="#e6e7e9"/><rect x="438" y="196" width="20" height="14" rx="3" fill="#fff" stroke="#e6e7e9"/><rect x="462" y="196" width="20" height="14" rx="3" fill="#fff" stroke="#e6e7e9"/><rect x="486" y="196" width="20" height="14" rx="3" fill="#fff" stroke="#e6e7e9"/><rect x="510" y="196" width="20" height="14" rx="3" fill="#fff" stroke="#e6e7e9"/>
  <text x="474" y="244" font-size="9.5" fill="#667382" text-anchor="middle">没有开关：两步并一步，</text>
  <text x="474" y="258" font-size="9.5" fill="#667382" text-anchor="middle">MLP 塌成一层废纸</text>
