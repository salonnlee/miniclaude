<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 352">
  <text x="16" y="26" font-size="13" font-weight="700" fill="#262626">图三 · 事实怎么住进权重：升维表配钥匙，降维表存货</text>
  <text x="16" y="46" font-size="10.5" fill="#667382">一条事实 = 一把钥匙配一份货，分散在许多权重上——不是一格一事实（key-value 记忆框架，Geva et al., 2021）</text>
  <text x="16" y="72" font-size="11" font-weight="600" fill="#262626">升维表 · 钥匙墙（每行一把钥匙）</text>
  <text x="388" y="72" font-size="11" font-weight="600" fill="#262626" text-anchor="middle">GELU</text>
  <text x="452" y="72" font-size="11" font-weight="600" fill="#262626">降维表 · 货架（每列一份货）</text>
  <rect x="16" y="82" width="310" height="44" rx="8" fill="#fff" stroke="rgba(194,65,12,.55)"/>
  <text x="30" y="108" font-size="11" fill="#f76707">🔑 K1 · 认出「Jordan＋篮球语境」</text>
  <rect x="16" y="134" width="310" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="30" y="160" font-size="11" fill="#4b5158">🔑 K2 · 认出「Sharapova＋球拍语境」</text>
  <rect x="16" y="186" width="310" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="30" y="212" font-size="11" fill="#4b5158">🔑 K3 · 认出「巴黎＋问首都」</text>
  <rect x="16" y="238" width="310" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="30" y="264" font-size="11" fill="#667382">🔑 K4 …… 每层 49,152 把钥匙</text>
  <rect x="452" y="82" width="412" height="44" rx="8" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.55)"/>
  <text x="466" y="108" font-size="11" fill="#f76707">📦 V1 · basketball 方向的成分一大坨</text>
  <rect x="452" y="134" width="412" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="466" y="160" font-size="11" fill="#4b5158">📦 V2 · tennis 方向的成分（本轮没取）</text>
  <rect x="452" y="186" width="412" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="466" y="212" font-size="11" fill="#4b5158">📦 V3 · 法国·首都关联成分（没取）</text>
  <rect x="452" y="238" width="412" height="44" rx="8" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="466" y="264" font-size="11" fill="#667382">📦 V4 …… 每层 49,152 份货</text>
  <rect x="360" y="96" width="56" height="28" rx="6" fill="rgba(194,65,12,.15)" stroke="rgba(194,65,12,.6)"/>
  <text x="388" y="114" font-size="10.5" fill="#f76707" text-anchor="middle">亮 1</text>
  <rect x="360" y="148" width="56" height="28" rx="6" fill="#fff" stroke="#e6e7e9"/>
  <text x="388" y="166" font-size="10.5" fill="#667382" text-anchor="middle">灭 0</text>
  <rect x="360" y="200" width="56" height="28" rx="6" fill="#fff" stroke="#e6e7e9"/>
  <text x="388" y="218" font-size="10.5" fill="#667382" text-anchor="middle">灭 0</text>
  <rect x="360" y="252" width="56" height="28" rx="6" fill="#fff" stroke="#e6e7e9"/>
  <text x="388" y="270" font-size="10.5" fill="#667382" text-anchor="middle">…</text>
  <line x1="326" y1="104" x2="348" y2="104" stroke="#f76707" stroke-width="2"/>
  <line x1="428" y1="110" x2="452" y2="110" stroke="#f76707" stroke-width="2"/>
  <line x1="326" y1="156" x2="348" y2="156" stroke="#e6e7e9" stroke-width="1.5"/>
  <line x1="428" y1="162" x2="452" y2="162" stroke="#e6e7e9" stroke-width="1.5"/>
  <line x1="326" y1="208" x2="348" y2="208" stroke="#e6e7e9" stroke-width="1.5"/>
  <rect x="16" y="298" width="848" height="44" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="440" y="316" font-size="11.5" fill="#2fb344" text-anchor="middle">模式匹配（钥匙）→ 开关放行 → 添货（把货加进输出向量）→ 出口打分</text>
  <text x="440" y="334" font-size="10.5" fill="#667382" text-anchor="middle">「Michael Jordan 后面接篮球」= K1 认出模式、V1 添方向——事实不在某格里，在 K1 配 V1 这条线里</text>
</svg>
