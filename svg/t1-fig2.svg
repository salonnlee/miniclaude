  <text x="755" y="244" font-size="10.5" fill="#667382" text-anchor="middle">同样的行 · 升级后的词义</text>

  <line x1="755" y1="250" x2="755" y2="332" stroke="#667382" stroke-width="1.5" marker-end="url(#tf2ar)"/>
  <text x="467" y="312" font-size="12" fill="#066fd1" text-anchor="middle">第 i 行进 = 第 i 行出 · 谁也不吞并谁</text>

  <rect x="260" y="336" width="560" height="52" rx="10" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.55)"/>
  <text x="276" y="356" font-size="12.5" font-weight="600" fill="#262626">🎯 只有最后一行去出口——只有它看完了全部前文</text>
  <text x="276" y="374" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">第 5 行「真」去出口打分 → 概率表：「好」61%（怎么打，下一节）</text>

  <text x="467" y="412" font-size="10.5" fill="#667382" text-anchor="middle">机器从头到尾没合并过任何一行——「猫追狗，狗追 __」的填空，发生在网外</text>
