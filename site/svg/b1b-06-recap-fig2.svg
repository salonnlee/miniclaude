<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440">
  <defs>
    <marker id="m6b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
  </defs>

  <text x="105" y="30" font-size="13" font-weight="600" fill="#262626">③ 参数账单 · 以 Key 一族为例，逐因子垒上去</text>
  <text x="105" y="48" font-size="10.5" fill="#667382">旋钮数 = 矩阵条目数；k 的每个数 = x 全部 12,288 个数的加权和，一根输出一行旋钮</text>

  <rect x="105" y="64" width="725" height="44" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="84" font-size="12.5" font-weight="600" fill="#262626">单头一张 W_K</text>
  <text x="121" y="101" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">128 × 12,288 = 1,572,864</text>
  <line x1="467" y1="110" x2="467" y2="116" stroke="#667382" stroke-width="1.5" marker-end="url(#m6b)"/>

  <rect x="105" y="118" width="725" height="44" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="138" font-size="12.5" font-weight="600" fill="#262626">× 96 头（各配各的，不共用）</text>
  <text x="121" y="155" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">= 150,994,944 ≈ 1.5 亿 / 层</text>
  <line x1="467" y1="164" x2="467" y2="170" stroke="#667382" stroke-width="1.5" marker-end="url(#m6b)"/>

  <rect x="105" y="172" width="725" height="44" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="192" font-size="12.5" font-weight="600" fill="#262626">× 96 块积木（每层一套）</text>
  <text x="121" y="209" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">= 14,495,514,624 ≈ 145 亿 —— 片中 Key 行的数字</text>
  <line x1="467" y1="218" x2="467" y2="224" stroke="#667382" stroke-width="1.5" marker-end="url(#m6b)"/>

  <rect x="105" y="226" width="725" height="44" rx="10" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.55)"/>
  <text x="121" y="246" font-size="12.5" font-weight="600" fill="#262626">× 4 族（Q / K / V / O 同形状）</text>
  <text x="121" y="263" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">= 57,982,058,496 ≈ 580 亿 —— 只占全网 1/3</text>
  <line x1="467" y1="272" x2="467" y2="278" stroke="#667382" stroke-width="1.5" marker-end="url(#m6b)"/>

  <rect x="105" y="280" width="725" height="44" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="121" y="300" font-size="12.5" font-weight="600" fill="#262626">＋ MLP 与嵌入，全账闭合</text>
  <text x="121" y="317" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">MLP 1,160 亿(12,288→49,152→12,288 × 96 层) + 嵌入 12 亿 → 580+1,160+12 ≈ 1,750 亿</text>

  <text x="105" y="346" font-size="10.5" fill="#667382">128 = 头宽 · 12,288 = 网络宽 · 96 = 头数 · 96 = 层数 —— 四个数全是人为定的设计值，两个 96 撞数纯属巧合</text>

  <rect x="105" y="368" width="725" height="46" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="467" y="387" font-size="12" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">注意力 580 亿(1/3) · MLP ≈ 1,160 亿(2/3) —— 注意力不是大头，偏置零头账单没算</text>
  <text x="467" y="405" font-size="10.5" fill="#667382" text-anchor="middle">学，就是学这 1,750 亿个数该取什么值 —— 3B2 下坡循环 + 3B3/3B4 反传，一帧未改</text>
</svg>
