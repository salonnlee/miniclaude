<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 668">
  <defs>
    <marker id="c31fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#066fd1"/></marker>
    <marker id="c31fo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f76707"/></marker>
    <marker id="c31fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fb344"/></marker>
  </defs>

  <text x="440" y="28" font-size="14" font-weight="600" fill="#262626" text-anchor="middle">工具调用三步曲 · 真机实录：「现在几点？3 小时后呢？」</text>

  <!-- 泳道底色 -->
  <rect x="56" y="46" width="368" height="470" rx="10" fill="rgba(37,99,235,.05)" stroke="rgba(37,99,235,.25)"/>
  <rect x="456" y="46" width="368" height="470" rx="10" fill="rgba(247,103,7,.05)" stroke="rgba(247,103,7,.25)"/>
  <text x="240" y="68" font-size="11.5" font-weight="600" fill="#066fd1" text-anchor="middle">你的代码 · 确定</text>
  <text x="640" y="68" font-size="11.5" font-weight="600" fill="#f76707" text-anchor="middle">模型 · 概率（接龙机器）</text>

  <!-- 1 用户输入 -->
  <rect x="76" y="82" width="328" height="44" rx="7" fill="#fff" stroke="rgba(37,99,235,.4)"/>
  <text x="240" y="100" font-size="10" fill="#262626" text-anchor="middle" font-weight="600">你&gt; 现在几点？3 小时后呢？</text>
  <text x="240" y="116" font-size="8.8" fill="#667382" text-anchor="middle">messages.push({ role:'user', … })</text>

  <!-- ① 声明+历史寄出 -->
  <line x1="406" y1="150" x2="474" y2="150" stroke="#066fd1" stroke-width="1.6" marker-end="url(#c31fa)"/>
  <text x="440" y="142" font-size="9" fill="#066fd1" text-anchor="middle">① 声明</text>
  <text x="440" y="164" font-size="8.3" fill="#667382" text-anchor="middle">说明书随行</text>

  <!-- 2 模型接出 tool_use -->
  <rect x="476" y="180" width="328" height="60" rx="7" fill="rgba(247,103,7,.08)" stroke="rgba(247,103,7,.55)"/>
  <text x="640" y="199" font-size="10" fill="#f76707" text-anchor="middle" font-weight="600">接龙：接出 tool_use —— get_time()</text>
  <text x="640" y="215" font-size="8.8" fill="#667382" text-anchor="middle">「我要查时间」· finish_reason = tool_calls（不是普通答话）</text>
  <text x="640" y="230" font-size="8.8" fill="#667382" text-anchor="middle">这一步没有 if 触发，是概率被 description 塑形后的落点</text>

  <!-- ② 分片回来 -->
  <line x1="474" y1="262" x2="406" y2="262" stroke="#f76707" stroke-width="1.6" marker-end="url(#c31fo)"/>
  <text x="440" y="254" font-size="9" fill="#f76707" text-anchor="middle">② 申请</text>
  <text x="440" y="276" font-size="8.3" fill="#667382" text-anchor="middle">分片攒齐</text>

  <!-- 3 代码执行+喂回 -->
  <rect x="76" y="292" width="328" height="74" rx="7" fill="#fff" stroke="rgba(37,99,235,.4)"/>
  <text x="240" y="310" font-size="10" fill="#262626" text-anchor="middle" font-weight="600">「开口要」入史 → execute() → 结果喂回</text>
  <text x="240" y="326" font-size="8.8" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">assistant.tool_calls 记下它开口要了 get_time</text>
  <text x="240" y="341" font-size="8.8" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">execute() → "2026/10/28 10:39:17"</text>
  <text x="240" y="356" font-size="8.8" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">{ role:'tool', tool_call_id, content } 塞回 messages</text>

  <!-- ③ 喂回再寄 -->
  <line x1="406" y1="388" x2="474" y2="388" stroke="#066fd1" stroke-width="1.6" marker-end="url(#c31fa)"/>
  <text x="440" y="380" font-size="9" fill="#066fd1" text-anchor="middle">③ 喂回</text>
  <text x="440" y="402" font-size="8.3" fill="#667382" text-anchor="middle">带结果再寄</text>

  <!-- 4 第二圈模型 -->
  <rect x="476" y="418" width="328" height="74" rx="7" fill="rgba(247,103,7,.08)" stroke="rgba(247,103,7,.55)"/>
  <text x="640" y="436" font-size="10" fill="#f76707" text-anchor="middle" font-weight="600">再接龙：这次接什么？</text>
  <text x="640" y="452" font-size="8.8" fill="#262626" text-anchor="middle">真机选择：10+3 心算就行——calculator 在柜里，</text>
  <text x="640" y="467" font-size="8.8" fill="#262626" text-anchor="middle">权衡后没用，直接接答案文本（纯说话）</text>
  <text x="640" y="483" font-size="8.5" fill="#f76707" text-anchor="middle">同一个工具可调可不调——「决定」是概率的落点</text>

  <!-- 5 退出 -->
  <line x1="474" y1="512" x2="406" y2="512" stroke="#2fb344" stroke-width="1.6" marker-end="url(#c31fg)"/>
  <text x="440" y="504" font-size="9" fill="#2fb344" text-anchor="middle">纯文本</text>
  <rect x="76" y="440" width="160" height="52" rx="7" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.45)"/>
  <text x="156" y="460" font-size="9.8" fill="#2fb344" text-anchor="middle" font-weight="600">无 tool_calls</text>
  <text x="156" y="476" font-size="8.6" fill="#2fb344" text-anchor="middle">打字机输出 → 循环退出</text>
  <text x="156" y="504" font-size="8.6" fill="#667382" text-anchor="middle">「现在 10:39，3 小时后 13:39」</text>

  <!-- 回环提示 -->
  <path d="M104,366 C66,394 66,414 104,438" fill="none" stroke="#066fd1" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#c31fa)"/>
  <text x="50" y="404" font-size="8.2" fill="#066fd1" text-anchor="middle" transform="rotate(-90 50 404)">若还要工具 → 回到 ①</text>

  <!-- 底部三条 -->
  <rect x="20" y="532" width="840" height="118" rx="9" fill="#f8f9fc" stroke="rgba(37,99,235,.3)"/>
  <text x="40" y="556" font-size="10.5" font-weight="600" fill="#262626">两个考点的标准答案（CH3 章脚）</text>
  <text x="40" y="578" font-size="9.6" fill="#262626">· 退出条件 = 这一轮没有 tool_calls、它只想说话——不是「调够 N 次」；谁在数圈数？没有人。</text>
  <text x="40" y="598" font-size="9.6" fill="#262626">· tool_result 以 role:'tool' 的消息、绑 tool_call_id 追在「开口要」的 assistant 记录之后——没有开口记录直接塞 tool 消息，API 当场 400。</text>
  <text x="40" y="622" font-size="9.6" fill="#2fb344">· 附赠一条工程直觉：工具报错不要崩溃——错误当结果喂回，让模型看着错误自我修复（CH4 正课）。</text>
  <text x="40" y="640" font-size="8.8" fill="#667382">账单提醒：工具轮的历史全部计费——上例三圈共 775+168 token ≈ ¥0.0055。</text>
</svg>
