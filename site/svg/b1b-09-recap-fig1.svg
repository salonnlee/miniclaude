<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 322">
  <text x="16" y="26" font-size="13" font-weight="700" fill="#262626">图一 · 全链：乔丹那根向量的一生</text>
  <text x="16" y="46" font-size="10.5" fill="#667382">文字进门第一步就变成向量，此后没有部件再碰文字——四站搬运改写的都是同一根 12,288 维向量</text>
  <rect x="16" y="64" width="186" height="84" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="30" y="86" font-size="12" font-weight="600" fill="#262626">① 嵌入（第 0 层·查表）</text>
  <text x="30" y="106" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">Jordan → 一列 12,288 个数</text>
  <text x="30" y="126" font-size="10" fill="#667382">毛坯词义：人名/篮球/约旦全掺着</text>
  <line x1="202" y1="106" x2="222" y2="106" stroke="#667382" stroke-width="1.5"/>
  <rect x="226" y="64" width="196" height="84" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="240" y="86" font-size="12" font-weight="600" fill="#262626">② 注意力（按前文调义）</text>
  <text x="240" y="106" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">跟「Michael」对暗号</text>
  <text x="240" y="126" font-size="10" fill="#667382">亮「篮球运动员」，压「约旦」</text>
  <line x1="422" y1="106" x2="442" y2="106" stroke="#667382" stroke-width="1.5"/>
  <rect x="446" y="64" width="196" height="84" rx="10" fill="rgba(194,65,12,.07)" stroke="rgba(194,65,12,.55)"/>
  <text x="460" y="86" font-size="12" font-weight="600" fill="#262626">③ MLP（本集主角·深加工）</text>
  <text x="460" y="106" font-size="10.5" fill="#f76707" font-family="ui-monospace,Menlo,monospace">49,152 台探测器盘问</text>
  <text x="460" y="126" font-size="10" fill="#667382">两步账＋一排开关 → 图二</text>
  <line x1="642" y1="106" x2="662" y2="106" stroke="#667382" stroke-width="1.5"/>
  <rect x="666" y="64" width="198" height="84" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="680" y="86" font-size="12" font-weight="600" fill="#262626">④ 出口（打分挑词）</text>
  <text x="680" y="106" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">W_U × softmax</text>
  <text x="680" y="126" font-size="10" fill="#667382">「篮球」61% 榜首，接龙交卷</text>
  <text x="16" y="180" font-size="10.5" fill="#667382">同一根向量，四站下来还是它——只是内容变了（示意 12 格）</text>
  <rect x="16.0" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="86.5" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="157.0" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="227.5" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="298.0" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="368.5" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="439.0" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="509.5" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="580.0" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="650.5" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="721.0" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/><rect x="791.5" y="190" width="66" height="30" rx="5" fill="#dfe3e9"/>
  <text x="16" y="246" font-size="10.5" fill="#667382">嵌入 = 毛坯词义 → 注意力 = 按前文调义 → MLP = 按方向添特征 → 出口 = 打分挑词</text>
  <rect x="16" y="262" width="848" height="46" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="440" y="281" font-size="12" fill="#2fb344" text-anchor="middle">重要结论：解释 Transformer 在干什么 = 解释这根高维向量里编码了什么</text>
  <text x="440" y="299" font-size="10.5" fill="#667382" text-anchor="middle">「特征」不住在神经元里，住在向量的方向里——后面三张图的公共钥匙</text>
</svg>
