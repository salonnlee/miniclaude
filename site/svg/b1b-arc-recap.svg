<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500">
  <defs>
    <marker id="barcar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
  </defs>

  <text x="50" y="30" font-size="13" font-weight="600" fill="#262626">四集一条线 · 一问接一问</text>
  <text x="50" y="48" font-size="10.5" fill="#667382">每张卡顶上的灰字，是上一卡答完留下的那道问题；卡内白字是本集的回答</text>

  <rect x="30" y="84" width="185" height="150" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="44" y="110" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">3B1 · 结构</text>
  <text x="44" y="132" font-size="10.5" font-style="italic" fill="#667382">这张网长什么样？</text>
  <text x="44" y="158" font-size="12.5" font-weight="600" fill="#262626">784 → 16 → 16 → 10</text>
  <text x="44" y="182" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">全连接 · 13,002 个旋钮</text>
  <text x="44" y="204" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">权重 · 偏置 · 激活值</text>
  <line x1="219" y1="159" x2="241" y2="159" stroke="#667382" stroke-width="1.5" marker-end="url(#barcar)"/>

  <rect x="244" y="84" width="185" height="150" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="258" y="110" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">3B2 · 目标</text>
  <text x="258" y="132" font-size="10.5" font-style="italic" fill="#667382">13,002 个旋钮值哪来？</text>
  <text x="258" y="158" font-size="12.5" font-weight="600" fill="#262626">loss 量好坏 · 负梯度下坡</text>
  <text x="258" y="182" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">[w,b] −= η·∇C</text>
  <text x="258" y="204" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">考题固定 · 旋钮是变量</text>
  <line x1="433" y1="159" x2="455" y2="159" stroke="#667382" stroke-width="1.5" marker-end="url(#barcar)"/>

  <rect x="458" y="84" width="185" height="150" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="472" y="110" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">3B3 · 直觉</text>
  <text x="472" y="132" font-size="10.5" font-style="italic" fill="#667382">∇C 这堆偏导怎么算？</text>
  <text x="472" y="158" font-size="12.5" font-weight="600" fill="#262626">单样本心愿逆流</text>
  <text x="472" y="182" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">杠杆 b · w · a</text>
  <text x="472" y="204" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">打乱分批 · SGD</text>
  <line x1="647" y1="159" x2="669" y2="159" stroke="#667382" stroke-width="1.5" marker-end="url(#barcar)"/>

  <rect x="672" y="84" width="185" height="150" rx="10" fill="#f8f9fc" stroke="rgba(194,65,12,.55)"/>
  <text x="686" y="110" font-size="11" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">3B4 · 数学</text>
  <text x="686" y="132" font-size="10.5" font-style="italic" fill="#667382">心愿逆流怎么成公式？</text>
  <text x="686" y="158" font-size="12.5" font-weight="600" fill="#262626">链式法则沿链乘回</text>
  <text x="686" y="182" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">∂C/∂w = a·σ′·心愿</text>
  <text x="686" y="204" font-size="10.5" fill="#066fd1" font-family="ui-monospace,Menlo,monospace">前向存激活 · 后向复用</text>

  <rect x="30" y="272" width="827" height="56" rx="10" fill="#f8f9fc" stroke="rgba(37,99,235,.45)"/>
  <text x="443" y="295" font-size="12.5" font-weight="600" fill="#262626" text-anchor="middle">🔁 一个循环记全剧</text>
  <text x="443" y="315" font-size="10.5" fill="#066fd1" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">前向算 loss → 反向算梯度 → 沿负梯度拧旋钮 → 循环往复</text>

  <rect x="30" y="360" width="827" height="72" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="443" y="385" font-size="12" fill="#2fb344" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">下一站：NN3 手推链式法则 × 数值互证 → 回开 NN2 死区之锁 → NN4 补完 P0.2 → 正片 P0.3</text>
  <text x="443" y="409" font-size="10.5" fill="#667382" text-anchor="middle">3B5/3B6/3B7 已观毕：接龙换考卷 · QKV 机关入册 · 卷积三台入册 —— 3B8 已观毕，支线收官</text>
</svg>
