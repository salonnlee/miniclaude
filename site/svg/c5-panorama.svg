<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640">
  <defs>
    <marker id="c5par" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#667382"/></marker>
    <marker id="c5parB" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#066fd1"/></marker>
    <marker id="c5parG" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2fb344"/></marker>
  </defs>

  <text x="60" y="32" font-size="13" font-weight="600" fill="#262626">① 一条流水线三段：定位 → 读取 → 修改</text>

  <rect x="50" y="54" width="220" height="130" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="160" y="80" font-size="12.5" font-weight="600" fill="#262626" text-anchor="middle">📍 定位：找文件，不碰内容</text>
  <text x="160" y="106" font-size="11" fill="#667382" text-anchor="middle">Glob 按名字：src/**/*.ts</text>
  <text x="160" y="126" font-size="11" fill="#667382" text-anchor="middle">Grep 按内容：registerFsTools</text>
  <text x="160" y="150" font-size="10.5" fill="#f76707" text-anchor="middle">只回答一件事：该去读哪个文件</text>
  <text x="160" y="170" font-size="10" fill="#667382" text-anchor="middle">面对两百个文件，没它就只能猜路径</text>

  <line x1="270" y1="119" x2="322" y2="119" stroke="#667382" stroke-width="1.6" marker-end="url(#c5par)"/>
  <text x="296" y="108" font-size="9.5" fill="#667382" text-anchor="middle">给出路径</text>

  <rect x="324" y="54" width="220" height="130" rx="10" fill="rgba(37,99,235,.07)" stroke="#066fd1"/>
  <text x="434" y="80" font-size="12.5" font-weight="600" fill="#066fd1" text-anchor="middle">👀 读取：Read</text>
  <text x="434" y="106" font-size="11" fill="#667382" text-anchor="middle">行号输出 · 截断 2000 行</text>
  <text x="434" y="126" font-size="11" fill="#667382" text-anchor="middle">二进制魔数检测</text>
  <text x="434" y="150" font-size="10.5" fill="#066fd1" text-anchor="middle">超限提示剩余行数——不吞也不糊</text>
  <text x="434" y="170" font-size="10" fill="#667382" text-anchor="middle">v1.0 的 read_file 原样</text>

  <line x1="544" y1="119" x2="596" y2="119" stroke="#667382" stroke-width="1.6" marker-end="url(#c5par)"/>
  <text x="570" y="108" font-size="9.5" fill="#667382" text-anchor="middle">看准了</text>

  <rect x="598" y="54" width="230" height="130" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="713" y="80" font-size="12.5" font-weight="600" fill="#2fb344" text-anchor="middle">✍️ 修改：Write / Edit</text>
  <text x="713" y="106" font-size="11" fill="#667382" text-anchor="middle">Write 整文件重写 · 自动建目录</text>
  <text x="713" y="126" font-size="11" fill="#667382" text-anchor="middle">Edit 精确替换 · 只动一段</text>
  <text x="713" y="150" font-size="10.5" fill="#2fb344" text-anchor="middle">零处/多处不当错误，当结果喂回</text>
  <text x="713" y="170" font-size="10" fill="#667382" text-anchor="middle">模型看着报告自己带上下文重试</text>

  <path d="M713,184 C713,230 434,230 434,188" fill="none" stroke="#2fb344" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#c5parG)"/>
  <text x="573" y="226" font-size="10.5" fill="#2fb344" text-anchor="middle">改完回读 = agent 的自检（Edit 后再 Read 一遍对账）</text>

  <text x="60" y="272" font-size="13" font-weight="600" fill="#262626">② 真实一单：从「改个 bug」到走完整条链</text>

  <rect x="50" y="290" width="778" height="58" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="440" y="313" font-size="11.5" fill="#262626" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">「validate is not defined」</text>
  <text x="440" y="334" font-size="10.5" fill="#667382" text-anchor="middle">v1.0 验收逮住的真 bug：v0.9 重构漏改 chat.ts 的 import——当时靠人眼对齐</text>

  <line x1="440" y1="348" x2="440" y2="370" stroke="#667382" stroke-width="1.6" marker-end="url(#c5par)"/>
  <text x="470" y="364" font-size="10" fill="#667382">文件五件在手，agent 自己走：</text>

  <rect x="50" y="372" width="170" height="64" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="135" y="396" font-size="11.5" font-weight="600" fill="#262626" text-anchor="middle">1 · Grep 「validate」</text>
  <text x="135" y="418" font-size="10" fill="#667382" text-anchor="middle">命中 fs.ts · index.ts</text>
  <text x="135" y="430" font-size="10" fill="#667382" text-anchor="middle">chat.ts 不在名单里</text>

  <line x1="220" y1="404" x2="256" y2="404" stroke="#667382" stroke-width="1.6" marker-end="url(#c5par)"/>

  <rect x="258" y="372" width="170" height="64" rx="10" fill="rgba(37,99,235,.07)" stroke="#066fd1"/>
  <text x="343" y="396" font-size="11.5" font-weight="600" fill="#066fd1" text-anchor="middle">2 · Read chat.ts</text>
  <text x="343" y="418" font-size="10" fill="#667382" text-anchor="middle">import 段没有 validate</text>
  <text x="343" y="430" font-size="10" fill="#667382" text-anchor="middle">漏改实锤</text>

  <line x1="428" y1="404" x2="464" y2="404" stroke="#667382" stroke-width="1.6" marker-end="url(#c5par)"/>

  <rect x="466" y="372" width="170" height="64" rx="10" fill="rgba(21,128,61,.07)" stroke="rgba(21,128,61,.55)"/>
  <text x="551" y="396" font-size="11.5" font-weight="600" fill="#2fb344" text-anchor="middle">3 · Edit 补一行 import</text>
  <text x="551" y="418" font-size="10" fill="#667382" text-anchor="middle">old_string 对准 import 段</text>
  <text x="551" y="430" font-size="10" fill="#667382" text-anchor="middle">零处 → 带上下文重试</text>

  <line x1="636" y1="404" x2="672" y2="404" stroke="#2fb344" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#c5parG)"/>

  <rect x="674" y="372" width="154" height="64" rx="10" fill="#e9f7ee" stroke="#2fb344"/>
  <text x="751" y="396" font-size="11.5" font-weight="600" fill="#2fb344" text-anchor="middle">4 · Read 复核 + 跑</text>
  <text x="751" y="418" font-size="10" fill="#667382" text-anchor="middle">跑命令要等 CH6 Bash</text>
  <text x="751" y="430" font-size="10" fill="#667382" text-anchor="middle">闭环差的那环已点名</text>

  <text x="60" y="482" font-size="13" font-weight="600" fill="#262626">③ 为什么是专用工具，不等 CH6 的 Bash 一把梭</text>

  <rect x="50" y="500" width="380" height="110" rx="10" fill="#f8f9fc" stroke="#e6e7e9"/>
  <text x="240" y="526" font-size="12" font-weight="600" fill="#262626" text-anchor="middle">Bash 里 find / grep 也能干这两件事</text>
  <text x="240" y="550" font-size="11" fill="#667382" text-anchor="middle">专用工具赢在两处：</text>
  <text x="240" y="572" font-size="11" fill="#262626" text-anchor="middle">输出是结构化匹配列表，不是终端噪声——</text>
  <text x="240" y="590" font-size="11" fill="#262626" text-anchor="middle">喂回模型更省 token、更不易误读</text>
  <text x="240" y="606" font-size="11" fill="#262626" text-anchor="middle">不执行 shell——权限面小，跨平台不踩坑</text>

  <line x1="430" y1="555" x2="468" y2="555" stroke="#066fd1" stroke-width="1.6" marker-end="url(#c5parB)"/>

  <rect x="470" y="500" width="358" height="110" rx="10" fill="rgba(194,65,12,.06)" stroke="rgba(194,65,12,.5)"/>
  <text x="649" y="526" font-size="12" font-weight="600" fill="#f76707" text-anchor="middle">平台边界：工具柜按平台长</text>
  <text x="649" y="550" font-size="11" fill="#667382" text-anchor="middle">浏览器分身（site/mc/）视角：文件五件全无——</text>
  <text x="649" y="568" font-size="11" fill="#262626" text-anchor="middle">网页碰不了文件系统，只剩 get_time / calculator</text>
  <text x="649" y="590" font-size="11" fill="#262626" text-anchor="middle">文件三件住 Node 侧 fs.ts，push 进 TOOLS</text>
  <text x="649" y="606" font-size="10.5" fill="#f76707" text-anchor="middle">「省着给能力」正是 CH6 权限系统的开场白</text>
</svg>
