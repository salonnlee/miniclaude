  <text x="169" y="101" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">7</text>
  <rect x="194" y="82" width="42" height="28" rx="5" fill="#fdf2f8" stroke="#e6e7e9" stroke-width="1"/>
  <text x="215" y="101" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">8</text>
  <text x="42" y="131" font-size="10" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">2</text>
  <rect x="56" y="114" width="42" height="28" rx="5" fill="#fef3c7" stroke="#e6e7e9" stroke-width="1"/>
  <text x="77" y="133" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">10</text>
  <rect x="102" y="114" width="42" height="28" rx="5" fill="#eef2ff" stroke="#e6e7e9" stroke-width="1"/>
  <text x="123" y="133" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">12</text>
  <rect x="148" y="114" width="42" height="28" rx="5" fill="#fdf2f8" stroke="#e6e7e9" stroke-width="1"/>
  <text x="169" y="133" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">14</text>
  <rect x="194" y="114" width="42" height="28" rx="5" fill="#ecfdf5" stroke="#f76707" stroke-width="2"/>
  <text x="215" y="133" font-size="11" text-anchor="middle" fill="#f76707" font-weight="700" font-family="ui-monospace,Menlo,monospace">16</text>
  <text x="42" y="163" font-size="10" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">3</text>
  <rect x="56" y="146" width="42" height="28" rx="5" fill="#eef2ff" stroke="#e6e7e9" stroke-width="1"/>
  <text x="77" y="165" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">15</text>
  <rect x="102" y="146" width="42" height="28" rx="5" fill="#fdf2f8" stroke="#e6e7e9" stroke-width="1"/>
  <text x="123" y="165" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">18</text>
  <rect x="148" y="146" width="42" height="28" rx="5" fill="#ecfdf5" stroke="#f76707" stroke-width="2"/>
  <text x="169" y="165" font-size="11" text-anchor="middle" fill="#f76707" font-weight="700" font-family="ui-monospace,Menlo,monospace">21</text>
  <rect x="194" y="146" width="42" height="28" rx="5" fill="#fef3c7" stroke="#e6e7e9" stroke-width="1"/>
  <text x="215" y="165" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">24</text>
  <text x="42" y="195" font-size="10" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">4</text>
  <rect x="56" y="178" width="42" height="28" rx="5" fill="#fdf2f8" stroke="#e6e7e9" stroke-width="1"/>
  <text x="77" y="197" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">20</text>
  <rect x="102" y="178" width="42" height="28" rx="5" fill="#ecfdf5" stroke="#f76707" stroke-width="2"/>
  <text x="123" y="197" font-size="11" text-anchor="middle" fill="#f76707" font-weight="700" font-family="ui-monospace,Menlo,monospace">24</text>
  <rect x="148" y="178" width="42" height="28" rx="5" fill="#fef3c7" stroke="#e6e7e9" stroke-width="1"/>
  <text x="169" y="197" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">28</text>
  <rect x="194" y="178" width="42" height="28" rx="5" fill="#eef2ff" stroke="#e6e7e9" stroke-width="1"/>
  <text x="215" y="197" font-size="11" text-anchor="middle" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">32</text>
  <text x="30" y="230" font-size="10.5" fill="#667382">同一条对角线（右上→左下）指数和 k 相同</text>
  <text x="30" y="248" font-size="10.5" fill="#f76707">k=2：c₂ = 16+21+24 = 61</text>
  <text x="330" y="56" font-size="11" fill="#667382">③ 对角线收账 → 乘积系数（还没进位）</text>
  <text x="330" y="82" font-size="11" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">c₀ = 4×8 = 32</text>
  <text x="330" y="110" font-size="11" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">c₁ = 4×7+3×8 = 52</text>
  <text x="330" y="138" font-size="11" fill="#f76707" font-weight="700" font-family="ui-monospace,Menlo,monospace">c₂ = 16+21+24 = 61</text>
  <text x="330" y="166" font-size="11" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">c₃ = 4×5+3×6+2×7+1×8 = 60</text>
  <text x="330" y="194" font-size="11" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">c₄ = 3×5+2×6+1×7 = 34</text>
  <text x="330" y="222" font-size="11" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">c₅ = 2×5+1×6 = 16</text>
  <text x="330" y="250" font-size="11" fill="#4b5158" font-weight="400" font-family="ui-monospace,Menlo,monospace">c₆ = 1×5 = 5</text>
  <text x="600" y="56" font-size="11" fill="#667382">④ 进位清洗：系数可以 ≥10，多的往前进</text>
  <text x="600" y="76" font-size="9.5" fill="#667382" font-family="ui-monospace,Menlo,monospace">k   和   +进  写  进</text>
  <text x="600" y="94" font-size="10.5" fill="#4b5158" font-family="ui-monospace,Menlo,monospace">k0  32   +0   <tspan font-weight="700">2</tspan>   3</text>
  <text x="600" y="118" font-size="10.5" fill="#4b5158" font-family="ui-monospace,Menlo,monospace">k1  52   +3   <tspan font-weight="700">5</tspan>   5</text>
  <text x="600" y="142" font-size="10.5" fill="#f76707" font-family="ui-monospace,Menlo,monospace">k2  61   +5   <tspan font-weight="700">6</tspan>   6</text>
  <text x="600" y="166" font-size="10.5" fill="#4b5158" font-family="ui-monospace,Menlo,monospace">k3  60   +6   <tspan font-weight="700">6</tspan>   6</text>
  <text x="600" y="190" font-size="10.5" fill="#4b5158" font-family="ui-monospace,Menlo,monospace">k4  34   +6   <tspan font-weight="700">0</tspan>   4</text>
  <text x="600" y="214" font-size="10.5" fill="#4b5158" font-family="ui-monospace,Menlo,monospace">k5  16   +4   <tspan font-weight="700">0</tspan>   2</text>
  <text x="600" y="238" font-size="10.5" fill="#4b5158" font-family="ui-monospace,Menlo,monospace">k6  5   +2   <tspan font-weight="700">7</tspan>   0</text>
  <rect x="600" y="272" width="256" height="34" rx="8" fill="#dcf3e1" stroke="#a8e0b5"/>
  <text x="728" y="295" font-size="14" text-anchor="middle" font-weight="700" fill="#2fb344" font-family="ui-monospace,Menlo,monospace">1234 × 5678 = 7,006,652</text>
  <text x="600" y="324" font-size="10.5" fill="#2fb344">BigInt 直乘 ✓ 卷积路线一致（C 台收尾自动对表）</text>
  <rect x="16" y="346" width="848" height="48" rx="10" fill="#dcf3e1" stroke="#a8e0b5"/>
  <text x="440" y="367" font-size="11.5" text-anchor="middle" fill="#2fb344">① 拆位：1234 = 1·x³+2·x²+3·x+4（x=10 取值，系数低位在前）——竖式 = 同一张表的阶梯排版，一张表两种读法</text>
  <text x="440" y="385" font-size="11.5" text-anchor="middle" fill="#2fb344">位数大走第三种：FFT（先变到频率侧逐点乘再变回来）绕开整张表，O(n²) → O(n log n)，一百万位差五万倍（算 π 走这条路）</text>
</svg>
