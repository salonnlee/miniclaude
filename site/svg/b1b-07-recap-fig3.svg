<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440">
  <text x="16" y="26" font-size="13" font-weight="700" fill="#262626">图三 · 大数乘法：一张乘法表，按对角线收账，再进位（C 台实拍简化）</text>
  <text x="30" y="56" font-size="11" fill="#667382">② 乘法表（行 = A 的位，列 = B 的位）</text>
  <text x="42" y="76" font-size="9" fill="#667382" text-anchor="middle">A╲B</text>
  <text x="78" y="76" font-size="10" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">5</text>
  <text x="124" y="76" font-size="10" fill="#667382" text-anchor="middle" font-family="ui-monospace,Menlo,monospace">6</text>
